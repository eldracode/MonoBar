[wifi]
wifi_ssid_masked = false # Hide the connected network name when enabled.
masked_ssid_name = "<redacted>"

[vpn]
profile_id = ""

# Shared bar defaults apply to every display without a monitor profile.
[bar]
monitor = "main"
width = "100%"
height = 36
offset_x = 0
offset_side = 0
float = true
offset_top = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_right = 0
radius_bottom_left = 0
padding = 16
module_margin = 12
socket = "~/.config/monobar/events.sock"

# Bars inherit the existing [bar] and [layout] settings, and profiles can override modules,
# width, height, offsets, corner radii, floating, padding, and module spacing.

#[monitors.laptop]
#screen = "main"
#height = 32
#offset_top = 2
#modules-right = ["wifi", "battery", "clock"]

#[monitors.external]
#screen = "DELL U2723QE"
#height = 40
#offset_side = 12
#modules-right = ["cpu", "ram", "clock"]

[colors]
background = "171A21E8"
foreground = "E7EAF0"
border = "343A46"
accent = "8AB4F8"

[fonts]
primary = "SF Pro Text"
fallback = "Apple Symbols"
size = 13

[layout]
modules-left = ["workspaces", "title"]
modules-center = ["music"]
modules-right = ["cpu", "ram", "battery", "volume", "mic", "vpn", "wifi", "bluetooth", "weather", "clock"]

[weather]
provider = "openweather"
api_key = ""
units = "metric"
refresh_minutes = 30
