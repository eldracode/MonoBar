[bar]
monitor = "main"
width = "100%"
height = 30
offset_x = 0
offset_y = 0
float = true
offset_top = 4
offset_side = 4
radius_top_left = 20
radius_top_right = 20
radius_bottom_right = 20
radius_bottom_left = 20

radius_top_left_notch = 10
radius_top_right_notch = 10
radius_bottom_right_notch = 10
radius_bottom_left_notch = 10

padding = 16
module_margin = 12
socket = "~/.config/monobar/events.sock"

[colors]
background = "171A21E8"
foreground = "E7EAF0"
border = "343A46"
accent = "8AB4F8"

[fonts]
primary = "SF Pro Text"
fallback = "Apple Symbols"
size = 11.5

[layout]
modules-left = ["workspaces", "title"]
modules-center = ["music"]
modules-right = ["vpn", "cpu", "ram", "battery", "volume", "mic", "wifi", "bluetooth", "weather", "clock"]

[weather]
provider = "openweather"
api_key = "<redacted>"
units = "metric"
refresh_minutes = 30

[wifi]
wifi_ssid_masked = false
masked_ssid_name = "<redacted>"

[vpn]
profile_id = "<redacted>"
