name: Build and release MonoBar

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Build release executable
        run: swift build -c release

      - name: Package macOS app
        id: package
        run: |
          set -euo pipefail
          APP_BUNDLE="$RUNNER_TEMP/MonoBar.app"
          ZIP_PATH="$RUNNER_TEMP/MonoBar-macOS-arm64.zip"

          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          install -m 755 .build/release/monobar "$APP_BUNDLE/Contents/MacOS/monobar"
          install -m 644 Resources/Info.plist "$APP_BUNDLE/Contents/Info.plist"
          install -m 644 Resources/MonoBar.icns "$APP_BUNDLE/Contents/Resources/MonoBar.icns"
          printf 'APPL????' > "$APP_BUNDLE/Contents/PkgInfo"
          cp -R .build/release/MonoBar_MonoBar.bundle "$APP_BUNDLE/Contents/Resources/"

          codesign --force --deep --sign - "$APP_BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: gh release create "$TAG_NAME" "$ZIP_PATH" --title "$TAG_NAME" --generate-notes
